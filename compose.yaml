services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.api:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.bot.main

  # Separate database: integration tests never touch the application data.
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test_only
      POSTGRES_DB: club_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d club_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  tests:
    build: .
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test_only@test-db:5432/club_test
    depends_on:
      test-db:
        condition: service_healthy
    command: sh -c "pip install --user 'pytest>=8,<10' 'pytest-asyncio>=0.25,<2' && python -m pytest -q"

volumes:
  postgres_data:
